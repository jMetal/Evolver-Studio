# Evolver-Studio's look: the colors of its logo (navy and teal) and its heading typeface
# (Montserrat, as the wordmark). Light and dark themes; the app follows the system's preference and
# the viewer can choose in the menu at the top right.

[theme]
baseRadius = "0.7rem"
headingFont = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap, sans-serif"
headingFontWeights = [800, 700, 700, 600, 600, 600]

[theme.light]
primaryColor = "#0E6BA8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F6FA"
textColor = "#12263A"
linkColor = "#0E7C8F"
borderColor = "#D5E2EC"

[theme.light.sidebar]
backgroundColor = "#F1F6FA"

[theme.dark]
primaryColor = "#3FB6CC"
backgroundColor = "#0C1620"
secondaryBackgroundColor = "#13222F"
textColor = "#DCE7EF"
linkColor = "#6FD8E6"
borderColor = "#25384A"

[theme.dark.sidebar]
backgroundColor = "#09111A"

[client]
# Hide the developer options (Deploy, Rerun settings) from the toolbar.
toolbarMode = "viewer"
