[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver-studio"
version = "0.1.0.dev0"
description = "Streamlit GUI and analysis tool for Evolver"
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pyyaml",
    "pandas",
    "plotly",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["evolver_studio*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
