<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="480" height="480">
  <title>Evolver-Studio icon</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3C6E"/><stop offset="1" stop-color="#0E6BA8"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#tile)"/>
  <!-- The Evolver fronts, in light tones on the tile. -->
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M56 22 C56 46 66 58 96 58" stroke="#7CD69B"/>
    <path d="M42 22 C42 56 56 70 96 70" stroke="#5CC8D6"/>
    <path d="M28 22 C28 64 44 82 96 82" stroke="#FFFFFF"/>
  </g>
  <!-- A slider: configuring the algorithm. -->
  <line x1="28" y1="99" x2="96" y2="99" stroke="#9FD8E3" stroke-width="5" stroke-linecap="round"/>
  <circle cx="66" cy="99" r="8" fill="#FFFFFF" stroke="#14A3B8" stroke-width="4"/>
</svg>
