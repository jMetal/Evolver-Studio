name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # A login shell, so that the conda set up below is on the path of every step.
    shell: bash -el {0}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The runners do not come with conda: Miniforge, whose channel is the environment's.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate: false
          conda-remove-defaults: "true"

      # The same steps as in the README.
      - name: Create the environment
        run: make env

      - name: Lint
        run: make lint

      # Without the jar, the tests that need it are skipped, so it is downloaded first.
      - name: Download Evolver's jar
        run: |
          conda run -n evolver-studio python -c "
          import sys
          from evolver_studio.evolver_client import Err, download_jar, jar_path
          result = download_jar(jar_path())
          sys.exit(result.message if isinstance(result, Err) else 0)
          "

      # make test stops at the first failure; here every failure is reported, with its output.
      # A runner has fewer cores than a laptop, and is shared: the runs of the tests get more time.
      - name: Test
        env:
          EVOLVER_STUDIO_TEST_TIME_FACTOR: "4"
        run: conda run --no-capture-output -n evolver-studio pytest tests/ -ra
